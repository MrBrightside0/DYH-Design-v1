<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>HOLA PAPU</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='Style.css'>
</head>
<body>
    <h1>HOLA PAPU</h1>
    <p>Para empezar a dibujar, tienes que seleccionar START. Puedes usar el botón CLEAR para borrar. Cuando termines presiona SAVE para guardar tu dibujo ;)</p>
    <div class="toolbar">
        <button id="start">START</button>
        <button id="clear">CLEAR</button>
        <button id="save">SAVE</button>
    </div>
    <canvas id="Canvas" width="900" height="650"></canvas>

    <script src='Canvas.js'></script>
</body>
</html>
