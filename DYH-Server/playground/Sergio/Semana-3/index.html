<!DOCTYPE html>
<html>
<head>
    <title>Multijugador a Color</title>
    <style>
        body { background: #111; color: #fff; font-family: monospace; overflow: hidden; }
        
        #mundo-juego {
            position: relative;
            width: 800px;
            height: 600px;
            background: #222;
            border: 2px solid #444;
            margin: 20px auto;
            overflow: hidden; /* Para que no se salgan del mapa */
        }

        /* Clase genérica para CUALQUIER jugador */
        .jugador {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 4px; /* Un poco cuadrado */
            border: 2px solid #fff; /* Borde blanco para resaltar */
            font-size: 10px;
            text-align: center;
            line-height: 30px;
            font-weight: bold;
            color: black;
            transition: all 0.1s linear; /* Movimiento suave */
        }

        #info { text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="info">
        <h1>Arena Multijugador</h1>
        <p>Abre varias pestañas. Cada una tendrá su color.</p>
        <div id="debug">Esperando conexión...</div>
    </div>

    <div id="mundo-juego">
        </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const mundo = document.getElementById('mundo-juego');
        const debug = document.getElementById('debug');

        // 1. GENERAR IDENTIDAD (Color y Posición Inicial)
        const miId = 'yo-' + Math.floor(Math.random() * 10000); // ID temporal local
        const miColor = generarColorAleatorio();
        let miPos = { x: 385, z: 285 }; // Centro (800/2 - ancho, 600/2 - alto)

        // 2. CREAR MI AVATAR (Visualización Local)
        crearOActualizarJugador(miId, miPos.x, miPos.z, miColor);

        // --- LÓGICA DE MOVIMIENTO (INPUT) ---
        document.addEventListener('keydown', (e) => {
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
                const velocidad = 15;

                // Actualizar posición matemática
                switch(e.key) {
                    case 'ArrowUp':    miPos.z -= velocidad; break;
                    case 'ArrowDown':  miPos.z += velocidad; break;
                    case 'ArrowLeft':  miPos.x -= velocidad; break;
                    case 'ArrowRight': miPos.x += velocidad; break;
                }

                // A. Mover MI cuadrado inmediatamente (Predicción del Cliente)
                crearOActualizarJugador(miId, miPos.x, miPos.z, miColor);
                debug.innerText = `Yo: X=${miPos.x} Z=${miPos.z} | Color: ${miColor}`;

                // B. Avisar al Servidor (Networking)
                socket.emit('mover-personaje', { 
                    x: miPos.x, 
                    y: 0, 
                    z: miPos.z, 
                    color: miColor // Enviamos mi color para que otros lo vean
                });
            }
        });

        // --- LÓGICA DE RED (NETWORKING) ---
        
        // Recibir movimiento de OTROS
        socket.on('posicion-actualizada', (datos) => {
            // Dibujar al otro jugador con SU color y SU ID
            crearOActualizarJugador(datos.id, datos.x, datos.z, datos.color);
        });

        // Limpiar jugadores desconectados (Bonus)
        socket.on('jugador-desconectado', (idRemoto) => {
            const el = document.getElementById(idRemoto);
            if (el) el.remove();
        });

        // --- FUNCIONES AUXILIARES ---

        // Esta función sirve tanto para MI como para LOS OTROS
        function crearOActualizarJugador(id, x, z, color) {
            let el = document.getElementById(id);
            
            // Si no existe, lo creamos (Spawn)
            if (!el) {
                el = document.createElement('div');
                el.id = id;
                el.className = 'jugador';
                el.style.backgroundColor = color;
                el.innerText = id === miId ? 'YO' : 'P2'; // Texto dentro del cuadro
                mundo.appendChild(el);
            }

            // Actualizamos posición
            el.style.left = x + 'px';
            el.style.top = z + 'px';
            
            // Aseguramos que el color sea correcto (por si acaso)
            if (color) el.style.backgroundColor = color;
        }

        function generarColorAleatorio() {
            // exadecimal para colores brillantes
            return '#' + Math.floor(Math.random()*16777215).toString(16);
        }
    </script>
</body>
</html>
