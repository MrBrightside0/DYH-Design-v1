<!DOCTYPE html>
<html>
  <head>
    <title>Chat con Ping</title>
    <style>
      body { font-family: 'Courier New', monospace; background: #222; color: #eee; padding: 20px; }
      #chat-box { 
        height: 300px; border: 1px solid #444; overflow-y: scroll; 
        background: #111; padding: 10px; margin-bottom: 10px; 
      }
      .mensaje { margin: 5px 0; }
      .sistema { color: #0f0; font-weight: bold; }
      input { padding: 10px; width: 70%; }
      button { padding: 10px; width: 20%; cursor: pointer; }
    </style>
  </head>
  <body>

    <h1>Terminal de Comunicaciones</h1>
    
    <div id="chat-box"></div>

    <form id="formulario">
      <input id="input-mensaje" autocomplete="off" placeholder="Escribe 'Ping' para probar..." />
      <button>Enviar</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const formulario = document.getElementById('formulario');
      const input = document.getElementById('input-mensaje');
      const chatBox = document.getElementById('chat-box');

      // --- ENVIAR MENSAJE ---
      formulario.addEventListener('submit', function(e) {
        e.preventDefault();
        const texto = input.value.trim();
        
        if (texto) {
          // Lógica de Comandos
          if (texto.toLowerCase() === 'estado') {
            if (socket.connected) {
              socket.emit('verificar-estado'); // Enviamos la orden al server
            } else {
              agregarMensaje('❌ Error: No hay conexión con el servidor.', 'sistema');
            }
          } 
          else if (texto.toLowerCase() === 'ping') {
            socket.emit('chat-mensaje', { texto: 'Ping', horaEnvio: Date.now() });
          } 
          else {
            // Mensaje normal
            socket.emit('chat-mensaje', { texto: texto, horaEnvio: Date.now() });
            agregarMensaje(`Yo: ${texto}`);
          }
          input.value = '';
        }
      });

      // --- RECIBIR RESPUESTA ---
      socket.on('chat-respuesta', function(data) {
        
        // CASO 1: Mensaje del Sistema (Estado)
        if (data.esSistema) {
          agregarMensaje(`SISTEMA: ${data.texto}`, 'sistema');
        } 
        // CASO 2: Respuesta de Ping
        else if (data.esPing) {
          const latencia = Date.now() - data.horaOriginal;
          agregarMensaje(`SERVIDOR: ${data.texto} ⚡ (${latencia} ms)`, 'sistema');
        } 
        // CASO 3: Chat Normal
        else {
          agregarMensaje(`Anonimo: ${data.texto}`);
        }
      });

      function agregarMensaje(texto, claseExtra = '') {
        const item = document.createElement('div');
        item.textContent = texto;
        item.className = `mensaje ${claseExtra}`;
        chatBox.appendChild(item);
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    </script>
  </body>
</html>
